<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
</helmet>
<div style="width:390px;height:844px;border-radius:52px;background:hsl(20 12% 12%);padding:10px;box-sizing:border-box;box-shadow:0 30px 60px -20px hsl(20 30% 20% / 0.35);">
  <div style="position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 30px 0;font-size:15px;font-weight:600;height:32px;">
      <span>9:41</span>
      <div style="width:110px;height:30px;border-radius:20px;background:hsl(20 12% 8%);"></div>
      <span style="display:flex;gap:5px;font-size:14px;"><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-full"></i></span>
    </div>
    <sc-if value="{{ backdrop }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:0;height:300px;pointer-events:none;">
        <svg viewBox="0 0 360 200" width="100%" height="300" preserveAspectRatio="xMidYMax slice" style="display:block;opacity:0.55;">

            <path d="M170 184v-50h8v-12h8v12h20v-12h8v12h20v-12h8v12h18v-12h8v12h14v50"></path>
            <path d="M320 184v-46h12v-12h8v12h24v46"></path>
            <path d="M0 184v-38h14v-10h10v10h16v38"></path>
          </g>

          <path d="M306 70v-5M306 70l4 2" stroke="var(--line)" stroke-width="1" stroke-linecap="round"></path>
          <circle cx="100" cy="104" r="62" fill="none" stroke="var(--line)" stroke-width="1.1"></circle>
          <circle cx="100" cy="104" r="5" fill="var(--line)"></circle>
          <path d="M100 42v124M38 104h124M56 60l88 88M144 60l-88 88" stroke="var(--line)" stroke-width="0.7"></path>
          <path d="M100 104l-20 80M100 104l20 80" stroke="var(--line)" stroke-width="1.1"></path>
          <path d="M0 184h360" stroke="var(--line)" stroke-width="1.1"></path>

          <path d="M20 192h70M150 196h120M290 191h60" stroke="var(--line)" stroke-width="1.1" stroke-linecap="round"></path>
        </svg>
        <div style="position:absolute;inset:0;background:linear-gradient(to bottom, var(--bg) 0%, transparent 30%, transparent 70%, var(--bg) 100%);"></div>
      </div>
    </sc-if>
    <div style="position:relative;flex:1;display:flex;flex-direction:column;gap:16px;padding:14px 20px 0;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="10" fill="var(--accent)"></rect><path d="M8 13c3-3 6-3 9 0s6 3 9 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"></path><path d="M8 21c3-3 6-3 9 0s6 3 9 0" fill="none" stroke="var(--accent-2-logo, #fff)" stroke-width="2.4" stroke-linecap="round"></path></svg>
          <span style="font-family:Lora,serif;font-size:20px;font-weight:600;letter-spacing:-0.01em;">{{ app }} Flow</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-weight:600;font-size:14px;">
          <i class="ph-duotone ph-flame" style="font-size:18px;color:var(--accent-2, var(--accent));"></i>7
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:13px;color:var(--muted);">Thursday, 1 October</span>
        <span style="font-family:Lora,serif;font-size:28px;font-weight:600;letter-spacing:-0.015em;line-height:1.2;">{{ greeting }}</span>
      </div>
      <div style="position:relative;height:196px;border-radius:12px;background:var(--card-surface, var(--card));border:1px solid var(--border);backdrop-filter:blur(4px);overflow:hidden;flex-shrink:0;">
        <sc-if value="{{ showCardArt }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:0;right:0;bottom:0;height:84px;">
          <sc-if value="{{ isAms }}" hint-placeholder-val="{{ true }}">
            <svg viewBox="0 0 360 120" width="100%" height="84" preserveAspectRatio="xMaxYMax meet" style="display:block;">
              <g fill="color-mix(in oklab, var(--accent) 10%, var(--card))" stroke="var(--line)" stroke-width="1.4" stroke-linejoin="round">
                <path d="M150 104V54h10V44h8V34h14v10h8v10h10v50"></path>
                <path d="M200 104V48q0-12 10-14q2-10 10-12q8 2 10 12q10 2 10 14v56"></path>
                <path d="M240 104V42h12V28h26v14h12v62"></path>
                <path d="M290 104V40l20-20 20 20v64"></path>
                <path d="M330 104V52h8V42h8V32h14v72"></path>
              </g>
              <g fill="var(--line)">
                <rect x="166" y="60" width="6" height="9" rx="1"></rect><rect x="178" y="60" width="6" height="9" rx="1"></rect><rect x="166" y="78" width="6" height="9" rx="1"></rect><rect x="178" y="78" width="6" height="9" rx="1"></rect>
                <rect x="210" y="52" width="6" height="9" rx="1"></rect><rect x="224" y="52" width="6" height="9" rx="1"></rect><rect x="210" y="72" width="6" height="9" rx="1"></rect><rect x="224" y="72" width="6" height="9" rx="1"></rect>
                <rect x="254" y="50" width="6" height="9" rx="1"></rect><rect x="270" y="50" width="6" height="9" rx="1"></rect><rect x="254" y="70" width="6" height="9" rx="1"></rect><rect x="270" y="70" width="6" height="9" rx="1"></rect>
                <rect x="300" y="48" width="6" height="9" rx="1"></rect><rect x="314" y="48" width="6" height="9" rx="1"></rect><rect x="300" y="68" width="6" height="9" rx="1"></rect><rect x="314" y="68" width="6" height="9" rx="1"></rect>
              </g>
              <path d="M110 104c0-24 18-34 30-34" fill="none" stroke="var(--line)" stroke-width="1.4"></path>
              <circle cx="126" cy="72" r="16" fill="color-mix(in oklab, var(--accent) 10%, var(--card))" stroke="var(--line)" stroke-width="1.4"></circle>
              <path d="M126 88v16" stroke="var(--line)" stroke-width="1.4"></path>
              <path d="M100 104h260" stroke="var(--line)" stroke-width="1.4"></path>
              <path d="M196 110q14 8 64 0" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"></path>
              <path d="M120 114h40M190 117h90M300 112h50" stroke="var(--line)" stroke-width="1.4" stroke-linecap="round"></path>
            </svg>
          </sc-if>
          <sc-if value="{{ isLon }}" hint-placeholder-val="{{ false }}">
            <svg viewBox="0 0 360 120" width="100%" height="84" preserveAspectRatio="xMaxYMax meet" style="display:block;">
              <g fill="color-mix(in oklab, var(--accent) 10%, var(--card))" stroke="var(--line)" stroke-width="1.4" stroke-linejoin="round">
                <path d="M300 104V44h-4V26h4V16l10-14 10 14v10h4v18h-4v60"></path>
                <path d="M200 104V70h6v-8h6v8h16v-8h6v8h16v-8h6v8h14v-8h6v8h24v34"></path>
                <path d="M320 104V74h10v-8h6v8h18v30"></path>
              </g>
              <circle cx="310" cy="35" r="6" fill="var(--card)" stroke="var(--line)" stroke-width="1.4"></circle>
              <path d="M310 35v-3.5M310 35l2.5 1.5" stroke="var(--line)" stroke-width="1.2" stroke-linecap="round"></path>
              <g fill="var(--line)">
                <rect x="216" y="80" width="5" height="10" rx="1"></rect><rect x="232" y="80" width="5" height="10" rx="1"></rect><rect x="248" y="80" width="5" height="10" rx="1"></rect><rect x="264" y="80" width="5" height="10" rx="1"></rect><rect x="280" y="80" width="5" height="10" rx="1"></rect>
                <rect x="306" y="54" width="8" height="10" rx="1"></rect><rect x="306" y="72" width="8" height="10" rx="1"></rect>
              </g>
              <circle cx="146" cy="58" r="40" fill="none" stroke="var(--line)" stroke-width="1.4"></circle>
              <circle cx="146" cy="58" r="4" fill="var(--line)"></circle>
              <path d="M146 18v80M106 58h80M118 30l56 56M174 30l-56 56" stroke="var(--line)" stroke-width="0.9"></path>
              <path d="M146 58l-14 46M146 58l14 46" stroke="var(--line)" stroke-width="1.4"></path>
              <path d="M100 104h260" stroke="var(--line)" stroke-width="1.4"></path>
              <rect x="226" y="84" width="40" height="20" rx="3" fill="var(--accent-2, var(--accent))"></rect>
              <path d="M226 93h40" stroke="var(--card)" stroke-width="1.4"></path>
              <circle cx="235" cy="105" r="3" fill="var(--text)"></circle><circle cx="258" cy="105" r="3" fill="var(--text)"></circle>
              <path d="M120 114h40M190 117h90M300 112h50" stroke="var(--line)" stroke-width="1.4" stroke-linecap="round"></path>
            </svg>
          </sc-if>
        </div></sc-if>
        <div style="position:relative;padding:16px 18px;display:flex;flex-direction:column;gap:6px;max-width:190px;">
          <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);">Today's goal</span>
          <span style="font-family:Lora,serif;font-size:22px;font-weight:600;line-height:1.2;">12 of 15 min</span>
          <div style="height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:4px;"><div style="width:80%;height:100%;border-radius:999px;background:var(--accent-2, var(--accent));"></div></div>
          <span style="font-size:13px;color:var(--muted);">3 more minutes today</span>
        </div>
      </div>
      <div style="border-radius:12px;background:var(--card-surface, var(--card));border:1px solid var(--border);backdrop-filter:blur(4px);padding:14px 18px;display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span style="font-family:Lora,serif;font-size:17px;font-weight:600;">7-day streak</span>
          <span style="font-size:13px;color:var(--muted);">Best: 21</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted);">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:30px;height:30px;border-radius:999px;background:var(--accent);display:grid;place-items:center;color:#fff;"><i class="ph-fill ph-check" style="font-size:14px;"></i></div>M</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:30px;height:30px;border-radius:999px;background:var(--accent);display:grid;place-items:center;color:#fff;"><i class="ph-fill ph-check" style="font-size:14px;"></i></div>T</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:30px;height:30px;border-radius:999px;background:var(--accent);display:grid;place-items:center;color:#fff;"><i class="ph-fill ph-check" style="font-size:14px;"></i></div>W</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:30px;height:30px;border-radius:999px;border:2px solid var(--accent-2, var(--accent));box-sizing:border-box;display:grid;place-items:center;color:var(--accent);"><i class="ph-duotone ph-flame" style="font-size:16px;color:var(--accent-2, var(--accent));"></i></div><span style="color:var(--text);font-weight:600;">T</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:30px;height:30px;border-radius:999px;background:var(--track);"></div>F</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:30px;height:30px;border-radius:999px;background:var(--track);"></div>S</div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:30px;height:30px;border-radius:999px;background:var(--track);"></div>S</div>
        </div>
      </div>
      <div style="border-radius:12px;background:var(--card-surface, var(--card));border:1px solid var(--border);backdrop-filter:blur(4px);padding:16px 18px;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);">Continue reading</span>
          <span style="font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-2-soft, var(--accent-soft));color:var(--accent-2-ink, var(--accent-ink));">{{ level }}</span>
        </div>
        <span style="font-family:Lora,serif;font-size:19px;font-weight:600;line-height:1.25;">{{ storyTitle }}</span>
        <span style="font-family:Lora,serif;font-style:italic;font-size:15px;line-height:1.5;color:var(--muted);">{{ storyLine }}</span>
        <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);">
          <div style="flex:1;height:6px;border-radius:999px;background:var(--track);overflow:hidden;"><div style="width:40%;height:100%;border-radius:999px;background:var(--accent);"></div></div>
          <span>Page 2 of 5</span>
        </div>
        <div style="height:46px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;margin-top:4px;">Continue <i class="ph-duotone ph-arrow-right" style="font-size:18px;"></i></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px 26px;background:var(--card);border-top:1px solid var(--border);font-size:11px;font-weight:500;color:var(--muted);text-align:center;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--accent-ink);font-weight:600;"><i class="ph-duotone ph-house" style="font-size:24px;color:var(--accent);"></i>Home</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><i class="ph-duotone ph-book-open" style="font-size:24px;"></i>Read</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><i class="ph-duotone ph-cards" style="font-size:24px;"></i>Cards</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><i class="ph-duotone ph-target" style="font-size:24px;"></i>Tasks</div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><i class="ph-duotone ph-user" style="font-size:24px;"></i>Me</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;app&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dutch&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;city&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ams&quot;,&quot;lon&quot;],&quot;default&quot;:&quot;ams&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;greeting&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Goedemorgen, Sanne&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;storyTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Een fiets voor Mila&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;storyLine&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mila wil een nieuwe fiets.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const city = this.props.city ?? 'ams';
    const backdrop = !!this.props.backdrop;
    return { isAms: city === 'ams', isLon: city === 'lon', backdrop, showCardArt: !backdrop };
  }
}
</script>
</body>
</html>
